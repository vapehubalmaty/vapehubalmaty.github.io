<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c060ff"/>
      <stop offset="100%" stop-color="#7a10e0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="32" height="32" rx="6" fill="#0a0018"/>

  <g filter="url(#glow)">
    <!-- V -->
    <polyline
      points="3,7 9,24 15,7"
      fill="none"
      stroke="url(#grad)"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- H -->
    <line x1="18" y1="7" x2="18" y2="24" stroke="url(#grad)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="18" y1="15.5" x2="29" y2="15.5" stroke="url(#grad)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="29" y1="7" x2="29" y2="24" stroke="url(#grad)" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
